<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f9fd"><meta name="apple-mobile-web-app-capable" content="yes"><title>الحضور والمغادرات | Shifti</title><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="shifti-core.css"></head><body class="sf-body"><main class="sf-shell"><header class="sf-top"><a class="sf-home" href="index.html">S</a><div class="sf-top-copy"><div class="sf-kicker">الوقت الفعلي بالدقيقة</div><div class="sf-title">الحضور والمغادرات</div><div class="sf-subtitle">Shifti · كل تفاصيل دوامك بمكان واحد</div></div></header>
<section class="sf-card"><div class="sf-toolbar"><label class="sf-field"><span>الشهر</span><input type="month" id="attMonth"></label><button class="sf-btn sf-primary" id="todayBtn">اليوم</button><button class="sf-btn sf-teal" id="quickToday">تسجيل اليوم</button></div></section>
<section class="sf-section"><div class="sf-kpis"><div class="sf-kpi"><span>أيام مسجلة</span><strong id="kRecorded">0</strong></div><div class="sf-kpi"><span>إجمالي وقت مسجل</span><strong id="kHours">0س</strong></div><div class="sf-kpi"><span>تأخير/نقص</span><strong id="kShort">0د</strong></div><div class="sf-kpi"><span>إضافي فعلي</span><strong id="kOt">0د</strong></div></div></section>
<section class="sf-section"><div class="sf-section-head"><h2>أيام الشهر</h2><small>اضغط على أي يوم للتعديل</small></div><div id="attList" class="sf-list"></div></section>
<div class="sf-modal" id="attModal"><div class="sf-sheet"><div class="sf-sheet-head"><div><small id="attModalDay"></small><h2 id="attModalDate"></h2></div><button class="sf-close" data-close>×</button></div><div class="sf-segment" style="margin-bottom:12px"><button type="button" data-quick="normal">دوام كامل</button><button type="button" data-quick="extra">كامل + إضافي</button><button type="button" data-quick="clear">مسح الوقت</button></div><div class="sf-form-grid"><label class="sf-field"><span>نوع اليوم</span><select id="attType"><option value="">تلقائي</option><option>دوام</option><option>عطلة أسبوعية</option><option>عطلة رسمية</option><option>إجازة مرضية</option><option>إجازة عرضية</option><option>غياب</option></select></label><label class="sf-field"><span>الشفت</span><select id="attShift"><option value="">تلقائي</option><option>صباحي</option><option>مسائي</option><option>عطلة</option></select></label><label class="sf-field"><span>الدخول — بالدقيقة</span><input id="attIn" type="time" step="60"></label><label class="sf-field"><span>الخروج — بالدقيقة</span><input id="attOut" type="time" step="60"></label><label class="sf-field full"><span>ملاحظات</span><textarea id="attNotes" rows="3" placeholder="تأخير، مغادرة، سبب، ملاحظة..."></textarea></label></div><div id="attPreview" class="sf-note" style="margin-top:12px"></div><div class="sf-actions"><button class="sf-btn sf-danger" id="attDelete">حذف الإدخال</button><button class="sf-btn sf-primary" id="attSave">حفظ اليوم</button></div></div></div><footer class="sf-footer">Shifti</footer></main><div id="sfToast" class="sf-toast"></div><script src="shifti-common.js"></script><script src="attendance.js"></script></body></html>
