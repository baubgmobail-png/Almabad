<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f9fd"><meta name="apple-mobile-web-app-capable" content="yes"><title>التدريب والشهادات | Shifti</title><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="shifti-core.css"></head><body class="sf-body"><main class="sf-shell"><header class="sf-top"><a class="sf-home" href="index.html">S</a><div class="sf-top-copy"><div class="sf-kicker">كل شهاداتك وتواريخها</div><div class="sf-title">التدريب والشهادات</div><div class="sf-subtitle">Shifti · كل تفاصيل دوامك بمكان واحد</div></div></header>
<section class="sf-card"><div class="sf-toolbar"><label class="sf-field"><span>الحالة</span><select id="trainFilter"><option value="all">الكل</option><option value="valid">سارية</option><option value="soon">قربت تنتهي</option><option value="expired">منتهية</option></select></label><button id="addTrain" class="sf-btn sf-teal">＋ دورة / شهادة</button></div></section><section class="sf-section"><div class="sf-kpis"><div class="sf-kpi"><span>المجموع</span><strong id="trainTotal">0</strong></div><div class="sf-kpi"><span>سارية</span><strong id="trainValid">0</strong></div><div class="sf-kpi"><span>قربت تنتهي</span><strong id="trainSoon">0</strong></div><div class="sf-kpi"><span>منتهية</span><strong id="trainExpired">0</strong></div></div></section><section class="sf-section"><div class="sf-section-head"><h2>التدريب والشهادات</h2><small>تواريخ الانتهاء واضحة</small></div><div id="trainList" class="sf-list"></div></section><div class="sf-modal" id="trainModal"><div class="sf-sheet"><div class="sf-sheet-head"><div><small>تدريب / شهادة</small><h2 id="trainTitle">إضافة</h2></div><button class="sf-close" data-close>×</button></div><div class="sf-form-grid"><label class="sf-field full"><span>اسم الدورة أو الشهادة</span><input id="trainName" type="text"></label><label class="sf-field"><span>الجهة</span><input id="trainProvider" type="text"></label><label class="sf-field"><span>رقم الشهادة</span><input id="trainNumber" type="text"></label><label class="sf-field"><span>تاريخ الحصول</span><input id="trainDate" type="date"></label><label class="sf-field"><span>تاريخ الانتهاء</span><input id="trainExpiry" type="date"></label><label class="sf-field"><span>تنبيه قبل الانتهاء (يوم)</span><input id="trainReminder" type="number" min="0" value="30"></label><label class="sf-field full"><span>ملاحظات</span><textarea id="trainNotes" rows="3"></textarea></label></div><div class="sf-actions"><button class="sf-btn sf-danger" id="trainDelete">حذف</button><button class="sf-btn sf-primary" id="trainSave">حفظ</button></div></div></div><footer class="sf-footer">Shifti</footer></main><div id="sfToast" class="sf-toast"></div><script src="shifti-common.js"></script><script src="training.js"></script></body></html>
