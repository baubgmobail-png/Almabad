<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f9fd"><meta name="apple-mobile-web-app-capable" content="yes"><title>رصيد الإجازات | Shifti</title><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="shifti-core.css"></head><body class="sf-body"><main class="sf-shell"><header class="sf-top"><a class="sf-home" href="index.html">S</a><div class="sf-top-copy"><div class="sf-kicker">رصيد واضح وسجل كامل</div><div class="sf-title">رصيد الإجازات</div><div class="sf-subtitle">Shifti · كل تفاصيل دوامك بمكان واحد</div></div></header>
<section class="sf-card"><div class="sf-form-grid"><label class="sf-field"><span>رصيد السنوية</span><input id="balAnnual" type="number" step="0.5" min="0"></label><label class="sf-field"><span>رصيد المرضية</span><input id="balSick" type="number" step="0.5" min="0"></label><label class="sf-field"><span>رصيد العرضية</span><input id="balCasual" type="number" step="0.5" min="0"></label><div style="display:flex;align-items:end"><button id="saveBalances" class="sf-btn sf-primary sf-wide">حفظ الأرصدة</button></div></div></section><section class="sf-section"><div class="sf-kpis"><div class="sf-kpi"><span>متبقي السنوية</span><strong id="remAnnual">0</strong></div><div class="sf-kpi"><span>متبقي المرضية</span><strong id="remSick">0</strong></div><div class="sf-kpi"><span>متبقي العرضية</span><strong id="remCasual">0</strong></div><div class="sf-kpi"><span>طلبات معلقة</span><strong id="pendingLeave">0</strong></div></div></section><section class="sf-section"><div class="sf-section-head"><h2>سجل الإجازات</h2><button class="sf-btn sf-teal" id="addLeave">＋ إضافة إجازة</button></div><div id="leaveList" class="sf-list"></div></section>
<div class="sf-modal" id="leaveModal"><div class="sf-sheet"><div class="sf-sheet-head"><div><small>إجازة</small><h2 id="leaveModalTitle">إضافة إجازة</h2></div><button class="sf-close" data-close>×</button></div><div class="sf-form-grid"><label class="sf-field"><span>النوع</span><select id="leaveType"><option>سنوية</option><option>مرضية</option><option>عرضية</option><option>بدون راتب</option><option>أخرى</option></select></label><label class="sf-field"><span>الحالة</span><select id="leaveStatus"><option>معتمدة</option><option>معلقة</option><option>مرفوضة</option></select></label><label class="sf-field"><span>من</span><input id="leaveFrom" type="date"></label><label class="sf-field"><span>إلى</span><input id="leaveTo" type="date"></label><label class="sf-field"><span>عدد الأيام</span><input id="leaveDays" type="number" step="0.5" min="0"></label><label class="sf-field"><span>مرجع/رقم الطلب</span><input id="leaveRef" type="text" placeholder="اختياري"></label><label class="sf-field full"><span>ملاحظات</span><textarea id="leaveNotes" rows="3"></textarea></label></div><div class="sf-note" style="margin-top:11px">عدد الأيام يُحسب تلقائياً من التاريخين، وتقدر تعدله يدوياً إذا نظام شركتك مختلف.</div><div class="sf-actions"><button class="sf-btn sf-danger" id="leaveDelete">حذف</button><button class="sf-btn sf-primary" id="leaveSave">حفظ</button></div></div></div><footer class="sf-footer">Shifti</footer></main><div id="sfToast" class="sf-toast"></div><script src="shifti-common.js"></script><script src="leave.js"></script></body></html>
