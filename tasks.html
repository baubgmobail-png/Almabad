<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f9fd"><meta name="apple-mobile-web-app-capable" content="yes"><title>المهام والمتابعة | Shifti</title><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="shifti-core.css"></head><body class="sf-body"><main class="sf-shell"><header class="sf-top"><a class="sf-home" href="index.html">S</a><div class="sf-top-copy"><div class="sf-kicker">كل شغلة بوقتها</div><div class="sf-title">المهام والمتابعة</div><div class="sf-subtitle">Shifti · كل تفاصيل دوامك بمكان واحد</div></div></header>
<section class="sf-card"><div class="sf-toolbar"><div class="sf-segment" id="taskSeg"><button data-filter="open" class="active">المعلقة</button><button data-filter="all">الكل</button><button data-filter="done">المكتملة</button></div><button id="addTask" class="sf-btn sf-teal">＋ مهمة</button></div></section><section class="sf-section"><div class="sf-kpis"><div class="sf-kpi"><span>معلقة</span><strong id="taskOpen">0</strong></div><div class="sf-kpi"><span>اليوم</span><strong id="taskToday">0</strong></div><div class="sf-kpi"><span>متأخرة</span><strong id="taskLate">0</strong></div><div class="sf-kpi"><span>مكتملة</span><strong id="taskDone">0</strong></div></div></section><section class="sf-section"><div class="sf-section-head"><h2>المهام</h2><small>رتب شغلك حسب الأولوية</small></div><div id="taskList" class="sf-list"></div></section><div class="sf-modal" id="taskModal"><div class="sf-sheet"><div class="sf-sheet-head"><div><small>مهمة</small><h2 id="taskTitle">إضافة مهمة</h2></div><button class="sf-close" data-close>×</button></div><div class="sf-form-grid"><label class="sf-field full"><span>المهمة</span><input id="taskName" type="text" placeholder="شو لازم تعمل؟"></label><label class="sf-field"><span>التاريخ</span><input id="taskDate" type="date"></label><label class="sf-field"><span>الوقت</span><input id="taskTime" type="time" step="60"></label><label class="sf-field"><span>الأولوية</span><select id="taskPriority"><option>عادية</option><option>مهمة</option><option>عاجلة</option></select></label><label class="sf-field"><span>الفئة</span><input id="taskCategory" type="text" placeholder="تقرير، مختبر، شخصي..."></label><label class="sf-field full"><span>ملاحظات</span><textarea id="taskNotes" rows="3"></textarea></label></div><div class="sf-actions"><button class="sf-btn sf-danger" id="taskDelete">حذف</button><button class="sf-btn sf-primary" id="taskSave">حفظ</button></div></div></div><footer class="sf-footer">Shifti</footer></main><div id="sfToast" class="sf-toast"></div><script src="shifti-common.js"></script><script src="tasks.js"></script></body></html>
