<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f9fd"><meta name="apple-mobile-web-app-capable" content="yes"><title>تسليم الشفت | Shifti</title><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="shifti-core.css"></head><body class="sf-body"><main class="sf-shell"><header class="sf-top"><a class="sf-home" href="index.html">S</a><div class="sf-top-copy"><div class="sf-kicker">لا تضيع أي ملاحظة بين الشفتات</div><div class="sf-title">تسليم الشفت</div><div class="sf-subtitle">Shifti · كل تفاصيل دوامك بمكان واحد</div></div></header>
<section class="sf-card"><div class="sf-toolbar"><label class="sf-field"><span>الشفت</span><select id="handFilter"><option value="all">كل الشفتات</option><option>A</option><option>B</option></select></label><label class="sf-field"><span>الحالة</span><select id="handStatusFilter"><option value="all">الكل</option><option>مفتوحة</option><option>مغلقة</option></select></label><button id="addHand" class="sf-btn sf-teal">＋ تسليم</button></div></section><section class="sf-section"><div class="sf-kpis"><div class="sf-kpi"><span>مفتوحة</span><strong id="handOpen">0</strong></div><div class="sf-kpi"><span>عاجلة</span><strong id="handUrgent">0</strong></div><div class="sf-kpi"><span>هذا الشهر</span><strong id="handMonth">0</strong></div><div class="sf-kpi"><span>مغلقة</span><strong id="handClosed">0</strong></div></div></section><section class="sf-section"><div class="sf-section-head"><h2>سجل تسليم الشفت</h2><small>ملاحظات ما بين الشفتات</small></div><div id="handList" class="sf-list"></div></section><div class="sf-modal" id="handModal"><div class="sf-sheet"><div class="sf-sheet-head"><div><small>تسليم شفت</small><h2 id="handTitle">إضافة ملاحظة</h2></div><button class="sf-close" data-close>×</button></div><div class="sf-form-grid"><label class="sf-field"><span>التاريخ</span><input id="handDate" type="date"></label><label class="sf-field"><span>الشفت</span><select id="handShift"><option>A</option><option>B</option></select></label><label class="sf-field full"><span>العنوان</span><input id="handName" type="text" placeholder="الموضوع الرئيسي"></label><label class="sf-field"><span>الأهمية</span><select id="handPriority"><option>عادية</option><option>مهمة</option><option>عاجلة</option></select></label><label class="sf-field"><span>تم التسليم إلى</span><input id="handTo" type="text" placeholder="اختياري"></label><label class="sf-field"><span>الحالة</span><select id="handState"><option>مفتوحة</option><option>مغلقة</option></select></label><label class="sf-field full"><span>التفاصيل</span><textarea id="handDetails" rows="5" placeholder="المشكلة، شو صار، شو لازم يتابع الشفت اللي بعدك..."></textarea></label></div><div class="sf-actions"><button class="sf-btn sf-danger" id="handDelete">حذف</button><button class="sf-btn sf-primary" id="handSave">حفظ</button></div></div></div><footer class="sf-footer">Shifti</footer></main><div id="sfToast" class="sf-toast"></div><script src="shifti-common.js"></script><script src="handover.js"></script></body></html>
